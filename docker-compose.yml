# Development compose: only Postgres. Backend and frontend run locally with hot-reload.
services:
  postgres:
    image: postgres:16-alpine
    container_name: senda-postgres
    environment:
      POSTGRES_DB: senda
      POSTGRES_USER: senda
      POSTGRES_PASSWORD: senda
    ports:
      # Loopback only: "5432:5432" publishes on every interface, and with the
      # well-known dev password anyone on the same network could read the database
      - "127.0.0.1:5432:5432"
    volumes:
      - senda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senda -d senda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  senda_pgdata:
