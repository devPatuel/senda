# Local development ONLY. Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
senda:
  auth:
    # Local development creates throwaway accounts all the time
    registration-enabled: true
  jwt:
    # No default on purpose: a committed secret would let anyone forge tokens for a local
    # install holding real data. start.command reads it from ~/Documents/Senda/jwt-secret.
    secret: ${SENDA_JWT_SECRET}
server:
  # Loopback only: this profile runs on a laptop with open sign-up, and binding to
  # every interface would offer the API to the whole network it is connected to.
  address: 127.0.0.1
spring:
  flyway:
    # The local database is shared by every git worktree, so it may hold migrations
    # from branches not merged into this one. Tolerate them instead of refusing to start.
    ignore-migration-patterns: "*:missing"
