spring:
  application:
    name: senda
  datasource:
    url: jdbc:postgresql://localhost:5432/senda
    username: senda
    password: senda
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

# Only the health endpoint over HTTP (used by the Docker healthcheck); status only,
# no details, and the rest of the actuator surface stays unexposed
management:
  endpoints:
    web:
      exposure:
        include: health

senda:
  auth:
    # Self-service sign-up. Closed by default: Senda is single-user in practice and
    # any deployment is reachable by every device on its network. Open it (true) only
    # long enough to create the first account, then close it again.
    registration-enabled: ${SENDA_REGISTRATION_ENABLED:false}
  jwt:
    # No default ON PURPOSE: without SENDA_JWT_SECRET the app must fail to start.
    # A known fallback secret would let anyone forge tokens for any user.
    # Local development: run with the 'local' profile (application-local.yml).
    secret: ${SENDA_JWT_SECRET}
    expiration: 24h
  cors:
    # Every URL the browser may load the app from. The Vite dev server is the
    # default because it is the only one that is the same on every machine; any
    # deployment adds its own with SENDA_CORS_ORIGINS (comma separated).
    # It must include the port: for CORS, a different port is a different origin.
    allowed-origins: ${SENDA_CORS_ORIGINS:http://localhost:5173}
