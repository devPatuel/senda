# Test-only overrides (merged on top of src/main/resources/application.yml).
# The main config has no JWT default on purpose (fail fast without SENDA_JWT_SECRET),
# so tests provide their own secret here. Must be >= 32 bytes for HS256.
senda.jwt.secret=senda-test-secret-0123456789abcdef0123456789abcdef

# Keep the auth rate limiter out of the way of functional tests (every MockMvc
# request shares 127.0.0.1); the limiter itself is covered by AuthRateLimitFilterTest.
senda.auth.rate-limit.max-attempts=100000
