# Serves the SPA and proxies /api to the backend (docker-compose.prod.yml).
#
# NOTE: this server speaks plain HTTP. Real deployments MUST sit behind the NAS
# reverse proxy with TLS terminated there (see docs/arquitectura.md, "Despliegue");
# otherwise credentials and the JWT travel in cleartext over the LAN.

server {
    # 8080: unprivileged ports only, the container runs nginx as non-root
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA. Spring Security only covers /api responses,
    # so the HTML/JS served here needs its own. The CSP matters because the JWT
    # lives in localStorage: limiting script sources reduces the impact of an XSS,
    # which is exactly the vector that would steal that token.
    # 'unsafe-inline' is limited to styles (React inline style attributes).
    # img-src allows any https: host because wishlist photos are links to shop
    # images; an image cannot run code, so this only lets pictures load.
    # worker-src allows blob: because the Excel reader unzips large sheets in a
    # worker built from a blob: URL. Only a script already running on the page can
    # create one, so it does not open a new way in; script-src stays 'self'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback: client-side routing handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (docker-compose.prod.yml)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with long cache (Vite emits hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location block discards server-level headers: repeat them
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
