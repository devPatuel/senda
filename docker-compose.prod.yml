# Production compose (target: home NAS). Builds and runs the full stack.
#
# Usage:
#   SENDA_DB_PASSWORD=... SENDA_JWT_SECRET=... docker compose -f docker-compose.prod.yml up -d --build
#
# ACCESO REMOTO — TLS: el frontend sirve HTTP en el puerto 8088. Si se accede por la
# IP de la LAN directa, las credenciales y el JWT (cabecera Authorization) viajan en
# claro. El acceso soportado es vía Tailscale (WireGuard cifra extremo a extremo entre
# dispositivos del tailnet), lo que mitiga esa exposición. Para HTTPS con certificado,
# usar `tailscale serve`. Ver docs/runbook-acceso-remoto-tailscale.md.
#
# NOTE — DB password: a Postgres volume keeps the password it was initialized
# with; exporting a different SENDA_DB_PASSWORD later does NOT change it.
services:
  postgres:
    image: postgres:16-alpine
    # No host port: only reachable from the backend through the compose network
    environment:
      POSTGRES_DB: senda
      POSTGRES_USER: senda
      # No default: failing fast beats silently booting with the dev password
      POSTGRES_PASSWORD: ${SENDA_DB_PASSWORD:?SENDA_DB_PASSWORD is required in production}
    volumes:
      - senda_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senda -d senda"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/senda
      SPRING_DATASOURCE_USERNAME: senda
      SPRING_DATASOURCE_PASSWORD: ${SENDA_DB_PASSWORD:?SENDA_DB_PASSWORD is required in production}
      # Must be provided via environment; no default in production
      SENDA_JWT_SECRET: ${SENDA_JWT_SECRET:?SENDA_JWT_SECRET is required in production}
      # Every URL the app is opened from, comma separated and with its port. The
      # browser sends an Origin header on writes and the backend rejects (403) any
      # origin missing here, so a remote name (Tailscale, NAS hostname) must be added.
      SENDA_CORS_ORIGINS: ${SENDA_CORS_ORIGINS:-http://localhost:8088}
      # nginx overwrites X-Real-IP with the peer address, and the backend port is not
      # published, so the login rate limit can count per real client instead of
      # putting everyone in nginx's single bucket.
      SENDA_CLIENT_IP_HEADER: X-Real-IP
      # Sign-up stays closed; set to true only to create the first account(s)
      SENDA_REGISTRATION_ENABLED: ${SENDA_REGISTRATION_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Actuator health is the only unauthenticated non-auth endpoint (status only)
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Give Spring time to boot and run Flyway migrations before counting failures
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # 8088 instead of 80: NAS systems (Synology DSM, etc.) usually reserve 80/443
      # for their own admin UI or reverse proxy. Container port is 8080 because
      # nginx runs unprivileged (non-root) inside the image.
      - "8088:8080"
    depends_on:
      # Wait for a healthy backend so nginx never starts serving 502s on /api
      # (and resolves the backend's final IP, not a stale one)
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  senda_pgdata_prod:
